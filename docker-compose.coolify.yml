services:
  api:
    build:
      context: ./api
      target: default
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: ${RP_ID:-ubuntu-2.tailcb8ab0.ts.net}
      ORIGIN: ${ORIGIN:-https://ubuntu-2.tailcb8ab0.ts.net:8447}
      RP_NAME: openGym PirateCoder
      DEFAULT_LANG: pt-BR
      TRUST_PROXY: "1"
      FIRST_USER_ADMIN: "1"
      ALLOW_GUEST: "0"
    volumes:
      - /home/ubuntu/opengym-data:/data
    labels:
      - traefik.enable=false

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:18080:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m
    labels:
      - traefik.enable=false
